<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Editor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="editor-shell">
      <div class="toolbar">
        <div class="toolbar-group">
          <button class="tool-btn" data-insert="# ">H1</button>
          <button class="tool-btn" data-insert="## ">H2</button>
          <button class="tool-btn" data-insert="- ">List</button>
          <button class="tool-btn" data-insert="**bold**">Bold</button>
          <button class="tool-btn" data-insert="*italic*">Italic</button>
        </div>
        <div class="toolbar-group">
          <button id="previewToggle" class="action-btn">Preview</button>
          <button id="saveBtn" class="action-btn">Save</button>
          <button id="clearBtn" class="action-btn secondary">Reset</button>
        </div>
      </div>

      <div class="editor-grid">
        <div class="editor-pane">
          <pre id="highlightLayer" class="highlight-layer" aria-hidden="true"></pre>
          <textarea id="editor" spellcheck="false"></textarea>
        </div>
        <div id="previewPane" class="preview-pane">
          <div id="preview" class="preview-content"></div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
